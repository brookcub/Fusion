name: Align F33 cold-import controls
on:
  push:
    branches: [patch/f33-20260914]
    paths: [.github/workflows/self-fix-f33-test-timeouts.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: patch/f33-20260914
          fetch-depth: 20
      - name: Give only cold-import controls the established bin-test budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/cli/src/__tests__/bin.test.ts')
          s=p.read_text()
          a='''  it("control: omitted setting retains the default dashboard port", async () => {\n    await runBin(["dashboard", "--no-supervise"]);\n    expect(commandMocks.runDashboard).toHaveBeenCalledWith(4040, expect.any(Object));\n  });\n'''
          b='''  it("control: omitted setting retains the default dashboard port", async () => {\n    await runBin(["dashboard", "--no-supervise"]);\n    expect(commandMocks.runDashboard).toHaveBeenCalledWith(4040, expect.any(Object));\n  }, 15_000);\n'''
          c='''  it.each([6789, 0])("control: explicit CLI port %i wins over stored settings", async (port) => {\n    await storePort(5678); await runBin(["dashboard", "--no-supervise", "--port", String(port)]);\n    expect(commandMocks.runDashboard).toHaveBeenCalledWith(port, expect.any(Object));\n  });\n'''
          d='''  it.each([6789, 0])("control: explicit CLI port %i wins over stored settings", async (port) => {\n    await storePort(5678); await runBin(["dashboard", "--no-supervise", "--port", String(port)]);\n    expect(commandMocks.runDashboard).toHaveBeenCalledWith(port, expect.any(Object));\n  }, 15_000);\n'''
          if s.count(a) != 1 or s.count(c) != 1:
              raise SystemExit('F33 control blocks did not match exactly once')
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          PY
          git rm .github/workflows/self-fix-f33-test-timeouts.yml
          git config user.name 'Brooklyn Rose Ludlow'
          git config user.email '22346091+brookcub@users.noreply.github.com'
          git add packages/cli/src/__tests__/bin.test.ts
          git commit -m 'test(F33): budget cold CLI import controls consistently'
          git push origin HEAD:refs/heads/patch/f33-20260914
