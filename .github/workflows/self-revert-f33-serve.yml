name: Remove accidental F33 serve broadening
on:
  push:
    branches: [patch/f33-20260914]
    paths: [.github/workflows/self-revert-f33-serve.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: patch/f33-20260914
          fetch-depth: 20
      - name: Restore serve port semantics and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/cli/src/bin.ts')
          s=p.read_text()
          start=s.index('      case "serve": {')
          end=s.index('      case "daemon": {', start)
          head, section, tail=s[:start], s[start:end], s[end:]
          new='''        const portIdx = args.indexOf("--port");\n        const portIdxShort = args.indexOf("-p");\n        const pi = portIdx !== -1 ? portIdx : portIdxShort;\n        let port: number;\n        if (pi !== -1) {\n          port = parseInt(args[pi + 1], 10);\n        } else {\n          const { GlobalSettingsStore } = await import("@fusion/core");\n          const settings = await new GlobalSettingsStore().getSettings();\n          port = settings.daemonPort ?? 4040;\n        }\n'''
          old='''        const portIdx = args.indexOf("--port");\n        const portIdxShort = args.indexOf("-p");\n        const pi = portIdx !== -1 ? portIdx : portIdxShort;\n        const port = pi !== -1 ? parseInt(args[pi + 1], 10) : 4040;\n'''
          if section.count(new) != 1:
              raise SystemExit(f'F33 expected exactly one broadened serve block, got {section.count(new)}')
          p.write_text(head + section.replace(new, old, 1) + tail)
          PY
          git rm .github/workflows/self-revert-f33-serve.yml
          git config user.name 'Brooklyn Rose Ludlow'
          git config user.email '22346091+brookcub@users.noreply.github.com'
          git add packages/cli/src/bin.ts
          git commit -m 'fix(F33): keep serve port semantics unchanged'
          git push origin HEAD:refs/heads/patch/f33-20260914
