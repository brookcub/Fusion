name: F12 atomic terminal-state fence staging
on:
  push:
    branches: [workbench/f12-terminal-fence-apply]
    paths: [.github/workflows/f12-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h localhost -p 5432 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FUSION_PG_TEST_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      PGPASSWORD: postgres
      FUSION_PG_TEST_SKIP: '0'
      FUSION_PG_TEST_REQUIRED: '1'
      FUSION_PG_TEST_SETUP_PARTICIPANT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: true
      - uses: ./.github/actions/setup-node-pnpm
      - name: Apply exact atomic upsert fence inside one function
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/task-store/branch-and-pr-entities.ts')
          text = p.read_text()
          old_import = 'import { and, asc, eq, inArray, isNull, ne, sql } from "drizzle-orm";'
          new_import = 'import { and, asc, eq, inArray, isNull, ne, notInArray, sql } from "drizzle-orm";'
          if text.count(old_import) != 1:
              raise SystemExit(f'expected exactly one drizzle import, saw {text.count(old_import)}')
          text = text.replace(old_import, new_import)

          start_marker = 'export async function saveWorkflowRunStepInstanceAsyncImpl('
          end_marker = '\nexport async function loadWorkflowRunStepInstancesAsyncImpl('
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('could not isolate saveWorkflowRunStepInstanceAsyncImpl')
          fn = text[start:end]
          conflict = '.onConflictDoUpdate({'
          if fn.count(conflict) != 1:
              raise SystemExit(f'expected one conflict update in save function, saw {fn.count(conflict)}')
          tail = '\n      },\n    });\n}'
          if fn.count(tail) != 1:
              raise SystemExit(f'expected one terminal set tail in save function, saw {fn.count(tail)}')
          guarded = '''
      },
      // Stale same-run writers may not regress a terminal instance. This predicate
      // lives in the conflict update itself so competing processes cannot race a
      // separate read-before-write check.
      setWhere: state.status === "completed" || state.status === "failed"
        ? sql`true`
        : notInArray(schema.project.workflowRunStepInstances.status, ["completed", "failed"]),
    });
}'''
          fn = fn.replace(tail, guarded)
          text = text[:start] + fn + text[end:]
          p.write_text(text)
          PY
          git diff --check
      - name: Typecheck core
        run: pnpm --filter @fusion/core typecheck
      - name: Prove PostgreSQL terminal fence and neighboring persistence cases
        run: pnpm --filter @fusion/core exec vitest run src/__tests__/postgres/workflow-step-instance-terminal-fence.pg.test.ts src/__tests__/postgres/workflow-run-step-instances.pg.test.ts --config vitest.pg.config.ts --reporter=verbose
      - name: Commit product-only staging result and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          remote="$(git ls-remote origin refs/heads/workbench/f12-terminal-fence-apply | cut -f1)"
          test "$remote" = "$expected"
          git config user.name 'Brooklyn Rose Ludlow'
          git config user.email '22346091+brookcub@users.noreply.github.com'
          git rm .github/workflows/f12-apply.yml
          git add packages/core/src/task-store/branch-and-pr-entities.ts
          git commit -m 'fix(F12): keep terminal foreach instance state monotonic'
          git push origin HEAD:refs/heads/workbench/f12-terminal-fence-apply
