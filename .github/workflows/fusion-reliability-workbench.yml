name: Fusion reliability workbench

# Temporary integration workbench; removed from the final PR tree.
on:
  push:
    branches: [codex/fusion-upstream-reliability]
    paths: [.github/workflows/fusion-reliability-workbench.yml]

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 200
          persist-credentials: false
      - name: Merge pinned upstream with reviewed conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fusion integration'
          git config user.email 'noreply@openai.com'
          git fetch --no-tags --depth=200 https://github.com/Runfusion/Fusion.git 1a0b95ba1ca6750a20d8d64cebcafbdf141cb4bb
          git branch upstream-snapshot 1a0b95ba1ca6750a20d8d64cebcafbdf141cb4bb
          git merge --no-commit --no-ff upstream-snapshot || test "$(git ls-files -u | wc -l)" -gt 0
          python .github/fusion-integration-resolve.py
          git commit -m 'Merge upstream through 1a0b95ba, consolidating recovery ownership and retaining Windows repairs'
      - name: Publish only the isolated integration branch
        shell: bash
        env:
          INTEGRATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$INTEGRATION_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/fusion-upstream-reliability
          unset auth INTEGRATION_TOKEN
      - uses: ./.github/actions/setup-node-pnpm
      - name: Export Linux test dependencies without credentials or application state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fusion-test-workspace"
          git show -s --format='%H %T %P' HEAD > "$RUNNER_TEMP/fusion-test-workspace/commit.txt"
          find . -name node_modules -type d -prune -print0 > "$RUNNER_TEMP/dependency-paths"
          tar --null -T "$RUNNER_TEMP/dependency-paths" -czf "$RUNNER_TEMP/fusion-test-workspace/dependencies.tar.gz"
          sha256sum "$RUNNER_TEMP/fusion-test-workspace/dependencies.tar.gz" > "$RUNNER_TEMP/fusion-test-workspace/SHA256SUMS"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fusion-linux-test-dependencies
          path: ${{ runner.temp }}/fusion-test-workspace
          retention-days: 1
          if-no-files-found: error
