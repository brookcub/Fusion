name: Fusion reliability workbench

# Temporary integration workbench; removed from the final PR tree.
on:
  push:
    branches: [codex/fusion-upstream-reliability]
    paths: [.github/workflows/fusion-reliability-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ef1069a295c91f671491c78ccb184e1926325458
          persist-credentials: false
      - name: Export source and exact Git manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integrated-source"
          git -c filter.lfs.process= -c filter.lfs.smudge= -c filter.lfs.required=false archive --format=tar HEAD | gzip > "$RUNNER_TEMP/integrated-source/source.tar.gz"
          git ls-tree -rz HEAD > "$RUNNER_TEMP/integrated-source/tree-manifest"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/integrated-source/identity.txt"
          sha256sum "$RUNNER_TEMP/integrated-source/source.tar.gz" > "$RUNNER_TEMP/integrated-source/SHA256SUMS"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fusion-integrated-source
          path: ${{ runner.temp }}/integrated-source
          retention-days: 1
          if-no-files-found: error
