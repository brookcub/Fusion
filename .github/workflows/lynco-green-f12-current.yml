name: LynCo F12 current-upstream GREEN refresh
on:
  push:
    branches: [qualification/green-f12-current-merge]
permissions:
  contents: read
jobs:
  f12:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FUSION_PG_TEST_URL_BASE: postgresql://postgres@localhost:5432
      FUSION_PG_TEST_SETUP_PARTICIPANT: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - run: pnpm --dir packages/core exec vitest run --config vitest.pg.config.ts src/__tests__/postgres/workflow-step-instance-terminal-fence.pg.test.ts --silent=passed-only --reporter=verbose
