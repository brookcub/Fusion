name: F01 runtime fix builder

on:
  push:
    branches: [automation/f01-runtime-fix-builder-20260916]

permissions:
  contents: write

env:
  TARGET_BRANCH: hardening/f01-windows-literal-argv
  TARGET_SHA: f30af0ab1645e6ffb9476a1420b552d52d30b08e

jobs:
  build-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Preserve patch script and checkout exact F01 tip
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/apply-f01-runtime-fix.py "$RUNNER_TEMP/apply-f01-runtime-fix.py"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Apply shell-free workspace tool fix
        shell: bash
        run: python "$RUNNER_TEMP/apply-f01-runtime-fix.py"

      - name: Verify focused behavior on Linux
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/desktop exec vitest run src/__tests__/workspace-literal-argv.test.ts --reporter=verbose
          pnpm check:changesets
          git diff --check

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          git config user.name "Brooklyn Rose Ludlow"
          git config user.email "22346091+brookcub@users.noreply.github.com"
          git add packages/desktop/scripts/workspace-tools.ts .changeset/f01-correctness.md
          git diff --cached --check
          git commit -m "fix(F01): preserve literal workspace tool argv on Windows"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
