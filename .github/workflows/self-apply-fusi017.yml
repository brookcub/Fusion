name: Apply FUSI017 completion ordering fix
on:
  push:
    branches: [patch/fusi017-20260914]
    paths: [.github/workflows/self-apply-fusi017.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: patch/fusi017-20260914
          fetch-depth: 20
      - name: Move accepted completion after required durable writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/engine/src/executor/create-task-done-tool.ts')
          s=p.read_text()
          old1='''\n        onDone();\n\n        // Mark all pending/in-progress steps as done\n'''
          new1='''\n        // Mark all pending/in-progress steps as done\n'''
          old2='''          bulkCompletionRefusalAt: null,\n        });\n        await store.logEntry(taskId, "Task marked done by agent", undefined, deps.getRunContextFor(taskId));\n'''
          new2='''          bulkCompletionRefusalAt: null,\n        });\n\n        // Completion is an acceptance signal for required durable state. Do not\n        // announce it before step/task writes succeed, but also do not make\n        // optional diagnostics or watchdog bookkeeping a new completion veto.\n        onDone();\n\n        await store.logEntry(taskId, "Task marked done by agent", undefined, deps.getRunContextFor(taskId));\n'''
          if s.count(old1) != 1: raise SystemExit('FUSI017 early onDone target drifted')
          if s.count(old2) != 1: raise SystemExit('FUSI017 durable-state target drifted')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1))
          PY
          git rm .github/workflows/self-apply-fusi017.yml
          git config user.name 'Brooklyn Rose Ludlow'
          git config user.email '22346091+brookcub@users.noreply.github.com'
          git add packages/engine/src/executor/create-task-done-tool.ts
          git commit -m 'fix(FUSI017): signal completion only after required durable writes'
          git push origin HEAD:refs/heads/patch/fusi017-20260914
