name: LynCo F25 shared CLI finalizer builder

on:
  push:
    branches: [automation/f25-cli-finalizer-followup-20260916]

permissions:
  contents: write

env:
  TARGET_BRANCH: fix/f25-vendored-claude-order-20260916
  TARGET_SHA: 697724b162f626e40c4614703427b5e260fe96c0

jobs:
  build-followup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Preserve patch script and checkout exact PR tip
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/lynco-f25-cli-finalizer.py "$RUNNER_TEMP/f25-finalizer.py"
          git fetch origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Apply shared finalizer follow-up
        shell: bash
        run: python "$RUNNER_TEMP/f25-finalizer.py"

      - name: Verify focused behavior
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/cli exec vitest run src/commands/__tests__/extension-paths.test.ts --reporter=verbose
          pnpm --dir packages/core exec vitest run src/__tests__/reconcile-claude-cli-paths.test.ts --reporter=verbose
          pnpm check:changesets

      - name: Commit and push follow-up
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          git config user.name "Brooklyn Rose Ludlow"
          git config user.email "22346091+brookcub@users.noreply.github.com"
          git add \
            .changeset/f25-vendored-claude-order.md \
            packages/cli/src/commands/extension-paths.ts \
            packages/cli/src/commands/__tests__/extension-paths.test.ts \
            packages/cli/src/commands/daemon.ts \
            packages/cli/src/commands/serve.ts \
            packages/cli/src/commands/dashboard.ts
          git diff --cached --check
          git commit -m "fix(F25): centralize CLI Claude path finalization"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
