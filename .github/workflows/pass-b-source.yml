name: Pass B source snapshots
on:
  push:
    branches: [workbench/pass-b-20260910]
    paths: [.github/workflows/pass-b-source.yml]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 795f80012036d4ed53533cf2378d2c20195a2b8f
          fetch-depth: 250
          persist-credentials: false
      - name: Export pinned public code only
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=250 https://github.com/Runfusion/Fusion.git d9411c95449c9bdbe6c5f50dd4883b975757140e
          mkdir -p "$RUNNER_TEMP/pass-b-current"
          python3 - <<'PY'
          import subprocess as s, json, pathlib, os, gzip, base64
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pass-b-current'
          def git(*args): return s.check_output(['git',*args])
          refs={'upstream':'d9411c95449c9bdbe6c5f50dd4883b975757140e','u0':'1a0b95ba1ca6750a20d8d64cebcafbdf141cb4bb','donor':'795f80012036d4ed53533cf2378d2c20195a2b8f','baseline':'0fcaffeaf48ef21c10dfbf70dbe4b5f90423b40f'}
          for name,ref in refs.items():
            (out/(name+'-tree.z')).write_bytes(git('ls-tree','-rz','--full-tree',ref))
            (out/(name+'-commit.txt')).write_bytes(git('cat-file','commit',ref))
          with gzip.open(out/'upstream.tar.gz','wb') as f:
            f.write(git('-c','core.autocrlf=false','-c','filter.lfs.smudge=','-c','filter.lfs.required=false','archive',refs['upstream']))
          changed=git('diff','--name-only','-z',refs['u0'],refs['donor']).decode().split('\0')
          versions={}
          for p in changed:
            if not p: continue
            record={}
            for name in ['u0','donor','upstream']:
              try: record[name]=base64.b64encode(git('show',refs[name]+':'+p)).decode()
              except s.CalledProcessError: record[name]=None
            versions[p]=record
          (out/'local-delta-versions.json').write_text(json.dumps(versions))
          (out/'local-net.patch').write_bytes(git('diff','--binary',refs['u0'],refs['donor']))
          (out/'upstream-log.txt').write_bytes(git('log','--format=%H %s',refs['u0']+'..'+refs['upstream']))
          (out/'local-log.txt').write_bytes(git('log','--format=%H %s',refs['u0']+'..'+refs['donor']))
          (out/'refs.json').write_text(json.dumps(refs,indent=2))
          PY
          cd "$RUNNER_TEMP/pass-b-current"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pass-b-current-sources
          path: ${{ runner.temp }}/pass-b-current
          retention-days: 7
          if-no-files-found: error
