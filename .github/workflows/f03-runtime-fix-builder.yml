name: F03 runtime fix builder

on:
  push:
    branches: [automation/f03-runtime-fix-builder-20260916]

permissions:
  contents: write

env:
  TARGET_BRANCH: hardening/f03-windows-owned-process-tree
  TARGET_SHA: 0d93e674aa37d5196ec26c1097c3b77e4fc31ca4
  DONOR_BRANCH: patch/f03-clean-20260915

jobs:
  build-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Preserve patch script and checkout exact F03 tip
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/apply-f03-runtime-fix.py "$RUNNER_TEMP/apply-f03-runtime-fix.py"
          git fetch origin "$DONOR_BRANCH"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Apply Windows owned-process-tree mechanism
        shell: bash
        run: |
          set -euo pipefail
          git checkout "origin/$DONOR_BRANCH" -- \
            packages/engine/src/sandbox/windows-owned-command.ts \
            packages/engine/src/sandbox/windows-owned-command-source.ts \
            .changeset/lynco-windows-owned-process-tree.md
          python "$RUNNER_TEMP/apply-f03-runtime-fix.py"

      - name: Verify Linux unaffected
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/engine exec vitest run src/sandbox/__tests__/windows-owned-command.test.ts --reporter=verbose
          pnpm check:changesets
          git diff --check

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          git config user.name "Brooklyn Rose Ludlow"
          git config user.email "22346091+brookcub@users.noreply.github.com"
          git add \
            .changeset/lynco-windows-owned-process-tree.md \
            packages/engine/src/sandbox/native.ts \
            packages/engine/src/sandbox/types.ts \
            packages/engine/src/sandbox/windows-owned-command.ts \
            packages/engine/src/sandbox/windows-owned-command-source.ts
          git diff --cached --check
          git commit -m "fix(F03): own Windows command process trees"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
