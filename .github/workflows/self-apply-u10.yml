name: Apply U10 incremental output fix
on:
  push:
    branches: [patch/u10-20260914]
    paths: [.github/workflows/self-apply-u10.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: patch/u10-20260914
          fetch-depth: 20
      - name: Invalidate package-local TypeScript incremental state for missing outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-workspace.mjs')
          s=p.read_text()
          old='import { existsSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";'
          new='import { existsSync, mkdirSync, readFileSync, rmSync, writeFileSync } from "node:fs";'
          if s.count(old) != 1: raise SystemExit('U10 import target drifted')
          s=s.replace(old,new)
          marker='export function main({\n'
          helper='''function clearIncrementalStateForMissingOutputs(plannedPackages, rootDir) {\n  for (const pkg of plannedPackages) {\n    if (pkg.buildReason !== \"missing-output\") continue;\n    const packageRoot = path.join(rootDir, pkg.dir);\n    const buildInfoFiles = fg.sync([\"**/*.tsbuildinfo\"], {\n      cwd: packageRoot,\n      onlyFiles: true,\n      unique: true,\n      ignore: [\"node_modules/**\", \"dist/**\"],\n    });\n    for (const relativePath of buildInfoFiles) {\n      rmSync(path.join(packageRoot, relativePath), { force: true });\n    }\n  }\n}\n\n'''
          if s.count(marker) != 1: raise SystemExit('U10 main marker drifted')
          s=s.replace(marker,helper+marker,1)
          old_call='  const result = runPlannedBuilds(plannedPackages, rootDir, spawnFn, { fullPackage: effectiveFullPackage, env });\n'
          new_call='''  // Missing emitted output invalidates package-local TypeScript incremental\n  // state. Without this, tsc may exit zero while intentionally emitting nothing.\n  clearIncrementalStateForMissingOutputs(plannedPackages, rootDir);\n  const result = runPlannedBuilds(plannedPackages, rootDir, spawnFn, { fullPackage: effectiveFullPackage, env });\n'''
          if s.count(old_call) != 1: raise SystemExit('U10 build call drifted')
          p.write_text(s.replace(old_call,new_call,1))
          PY
          git rm .github/workflows/self-apply-u10.yml
          git config user.name 'Brooklyn Rose Ludlow'
          git config user.email '22346091+brookcub@users.noreply.github.com'
          git add scripts/build-workspace.mjs
          git commit -m 'fix(U10): invalidate incremental state when required output is missing'
          git push origin HEAD:refs/heads/patch/u10-20260914
