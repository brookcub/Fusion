name: LynCo U09 portable Windows regression follow-up

on:
  push:
    branches: [automation/u09-portable-windows-regression-20260916]

permissions:
  contents: write

jobs:
  build-follow-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/u09-windows-artifact-entrypoint-20260916
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      - name: Add portable Windows main-entry seam and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/ensure-test-artifacts.mjs")
          text = source.read_text()
          old = 'if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {\n'
          new = '''export function isMainModule(moduleUrl, argvPath, windows = undefined) {\n  if (!argvPath) return false;\n  return moduleUrl === pathToFileURL(argvPath, { windows }).href;\n}\n\nif (isMainModule(import.meta.url, process.argv[1])) {\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one current U09 guard, found {text.count(old)}")
          source.write_text(text.replace(old, new, 1))

          test_file = Path("scripts/__tests__/ensure-test-artifacts-entrypoint.test.mjs")
          test_file.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath, pathToFileURL } from "node:url";

          const here = dirname(fileURLToPath(import.meta.url));
          const root = resolve(here, "../..");
          const script = resolve(root, "scripts/ensure-test-artifacts.mjs");
          const artifact = await import(pathToFileURL(script).href);

          test("control: exported artifact helper computes a source hash", () => {
            assert.match(artifact.computeCombinedSourceHash(root), /^[a-f0-9]{64}$/);
          });

          test("main-module detection handles Windows argv paths on every host", () => {
            const windowsScript = String.raw`C:\fusion repo\scripts\ensure-test-artifacts.mjs`;
            const windowsModuleUrl = "file:///C:/fusion%20repo/scripts/ensure-test-artifacts.mjs";

            assert.equal(pathToFileURL(windowsScript, { windows: true }).href, windowsModuleUrl);
            assert.equal(artifact.isMainModule(windowsModuleUrl, windowsScript, true), true);
            assert.equal(artifact.isMainModule(`file://${windowsScript}`, windowsScript, true), false);
          });

          test("artifact CLI executes on this OS and emits the same source hash", () => {
            const output = execFileSync(process.execPath, [script, "--print-source-hash"], {
              cwd: root,
              encoding: "utf8",
              timeout: 10_000,
            }).trim();
            assert.equal(
              output,
              artifact.computeCombinedSourceHash(root),
              "plain Node entrypoint must execute rather than silently no-op",
            );
          });
          '''.replace("          ", ""))
          PY

          git diff --check
          node --test scripts/__tests__/ensure-test-artifacts-entrypoint.test.mjs

      - name: Commit follow-up to PR branch
        shell: bash
        run: |
          git config user.name "Brooklyn Rose Ludlow"
          git config user.email "22346091+brookcub@users.noreply.github.com"
          git add scripts/ensure-test-artifacts.mjs scripts/__tests__/ensure-test-artifacts-entrypoint.test.mjs
          git commit -m "test(U09): enforce Windows entrypoint semantics portably"
          git push origin HEAD:fix/u09-windows-artifact-entrypoint-20260916
