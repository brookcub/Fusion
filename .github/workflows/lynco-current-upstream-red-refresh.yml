name: LynCo final current-upstream qualification

on:
  push:
    branches:
      - qualification/red-refresh-a8c2de5

permissions:
  contents: read

jobs:
  f33:
    name: F33 refreshed / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - name: Adapt only current-head command mock surface
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "packages/cli/src/__tests__/bin.test.ts";
          let text = readFileSync(path, "utf8");
          const nl = text.includes("\r\n") ? "\r\n" : "\n";

          if (!text.includes("runTaskReconcile: vi.fn()")) {
            const anchor = /  runTaskMerge: vi\.fn\(\),(?:\r?\n)/;
            if (!anchor.test(text)) throw new Error("F33 task fixture anchor 1 moved");
            text = text.replace(anchor, (match) => match + `  runTaskReconcile: vi.fn(),${nl}`);
          }
          if (!text.includes("runTaskReconcile: commandMocks.runTaskReconcile")) {
            const anchor = /  runTaskMerge: commandMocks\.runTaskMerge,(?:\r?\n)/;
            if (!anchor.test(text)) throw new Error("F33 task fixture anchor 2 moved");
            text = text.replace(anchor, (match) => match + `  runTaskReconcile: commandMocks.runTaskReconcile,${nl}`);
          }

          if (!text.includes('vi.mock("../commands/mcp-memory-server.js"')) {
            const importAnchor = /(import[^\n]+from "vitest";\r?\n)/;
            if (!importAnchor.test(text)) throw new Error("F33 vitest import anchor moved");
            text = text.replace(
              importAnchor,
              (match) => match + `vi.mock("../commands/mcp-memory-server.js", () => ({ runMcpMemoryServer: vi.fn() }));${nl}`,
            );
          }

          writeFileSync(path, text);
          NODE
      - name: Run unchanged stored F33 dashboard-port assertions
        shell: bash
        run: pnpm --dir packages/cli exec vitest run src/__tests__/bin.test.ts -t "actual stored dashboard port dispatch" --silent=passed-only --reporter=verbose

  f32-release-path:
    name: F32 official release build freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - name: Seed existing stale desktop output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/desktop/dist packages/cli/dist
          mkdir -p packages/desktop/dist
          printf 'stale-desktop-sentinel\n' > packages/desktop/dist/lynco-stale-sentinel.txt
      - name: Run the exact release build contract
        run: pnpm build:full
      - name: Require fresh desktop source output and staged CLI runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/desktop/dist/main.js
          test -f packages/cli/dist/desktop/main.js
          if test -e packages/desktop/dist/lynco-stale-sentinel.txt; then
            echo 'root build:full retained stale desktop sentinel in source dist' >&2
            exit 1
          fi
          if test -e packages/cli/dist/desktop/lynco-stale-sentinel.txt; then
            echo 'root build:full staged stale desktop sentinel into CLI dist' >&2
            exit 1
          fi
          node --check packages/cli/dist/desktop/main.js
