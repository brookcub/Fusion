name: Apply F33 stored dashboard port fix
on:
  push:
    branches: [patch/f33-20260914]
    paths: [.github/workflows/self-apply-f33.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: patch/f33-20260914
          fetch-depth: 20
      - name: Use explicit port or canonical stored setting
        shell: bash
        run: |
          set -euo pipefail
          # One-shot branch surgery: the resulting product commit removes this workflow.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/cli/src/bin.ts')
          s=p.read_text()
          old='''        const portIdx = args.indexOf("--port");\n        const portIdxShort = args.indexOf("-p");\n        const pi = portIdx !== -1 ? portIdx : portIdxShort;\n        const port = pi !== -1 ? parseInt(args[pi + 1], 10) : 4040;\n        const paused = args.includes("--paused");\n'''
          new='''        const portIdx = args.indexOf("--port");\n        const portIdxShort = args.indexOf("-p");\n        const pi = portIdx !== -1 ? portIdx : portIdxShort;\n        let port: number;\n        if (pi !== -1) {\n          port = parseInt(args[pi + 1], 10);\n        } else {\n          const { GlobalSettingsStore } = await import("@fusion/core");\n          const settings = await new GlobalSettingsStore().getSettings();\n          port = settings.daemonPort ?? 4040;\n        }\n        const paused = args.includes("--paused");\n'''
          count=s.count(old)
          if count != 2: raise SystemExit(f'F33 expected dashboard+serve blocks, got {count}')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/self-apply-f33.yml
          git config user.name 'Brooklyn Rose Ludlow'
          git config user.email '22346091+brookcub@users.noreply.github.com'
          git add packages/cli/src/bin.ts
          git commit -m 'fix(F33): honor stored dashboard port when flag is omitted'
          git push origin HEAD:refs/heads/patch/f33-20260914
